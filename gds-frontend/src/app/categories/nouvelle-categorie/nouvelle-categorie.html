<div class="container-fluid px-2 px-md-4 py-3">
  <div class="row mb-3">
    <div class="col-12">
      <h4 class="h4"><i class="fa-solid fa-plus-circle me-2 text-primary"></i>Nouvelle catégorie</h4>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="alert alert-danger" *ngIf="errorMsgs.length > 0">
        <ul class="mb-0">
          <li *ngFor="let msg of errorMsgs">{{msg}}</li>
        </ul>
      </div>

      <form>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold small">Code catégorie</label>
            <input type="text" 
                   class="form-control" 
                   placeholder="Ex: CAT-001" 
                   name="codeCategory" 
                   [(ngModel)]="categoryDto.code">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-bold small">Désignation</label>
            <input type="text" 
                   class="form-control" 
                   placeholder="Nom de la catégorie" 
                   name="designationCat" 
                   [(ngModel)]="categoryDto.designation">
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-danger px-4" (click)="cancel()">
        <i class="fa-solid fa-ban me-2"></i>Annuler
      </button>
      <button type="button" class="btn btn-primary px-4 shadow" (click)="enregistrerCategory()">
        <i class="fa-regular fa-floppy-disk me-2"></i>Enregistrer
      </button>
    </div>
  </div>
</div>
