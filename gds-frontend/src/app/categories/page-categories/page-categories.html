<div class="container-fluid px-2 px-md-4">
  <div class="row align-items-center my-3 g-3">
    <div class="col-12 col-md-6 text-center text-md-start">
      <h1 class="h3 mb-0">Liste des catégories</h1>
    </div>
    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
      <app-boutton-action (clickEvent)="nouvelleCategorie()"></app-boutton-action>
    </div>
  </div>

  <div class="alert alert-danger mx-2" *ngIf="errorMsgs">
    {{errorMsgs}}
  </div>

  <div class="row g-3 mx-0">
    <div class="col-12 px-2" *ngFor="let cat of listCategories">
      <div class="card shadow-sm border-0 hover-effect">
        <div class="card-body p-3">
          <div class="row align-items-center g-3">
            <div class="col-12 col-sm-6 col-md-3 border-md-end text-center text-md-start">
              <span class="text-muted small d-md-none">Code: </span>
              <span class="fw-bold text-primary">{{cat.code}}</span>
            </div>
            
            <div class="col-12 col-sm-6 col-md-4 border-md-end text-center text-md-start">
              <span class="text-muted small d-md-none">Désignation: </span>
              <span>{{cat.designation}}</span>
            </div>

            <div class="col-12 col-md-5 d-flex justify-content-center justify-content-md-around flex-wrap gap-2">
              <button type="button" class="btn btn-link text-decoration-none btn-sm p-0" 
                      (click)="cat.id !== undefined && modifierCategory(cat.id)">
                <i class="fa-solid fa-pencil me-1"></i>Modifier
              </button>
              <button type="button" class="btn btn-link text-danger text-decoration-none btn-sm p-0" 
                      (click)="ouvrirModalDelete(cat)">
                <i class="fa-solid fa-trash me-1"></i>Supprimer
              </button>
              <button type="button" class="btn btn-link text-secondary text-decoration-none btn-sm p-0">
                <i class="fa-solid fa-rectangle-list me-1"></i>Détails
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row my-4 justify-content-center" *ngIf="listCategories.length > 0">
    <div class="col-auto">
      <app-pagination></app-pagination>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" *ngIf="showDeleteModal"></div>
<div class="modal d-block" *ngIf="showDeleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>Confirmation</h5>
        <button type="button" class="btn-close" (click)="fermerModal()"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <p class="mb-0">Êtes-vous sûr de vouloir supprimer la catégorie <strong>{{categoryToDelete?.code}}</strong> ?</p>
        <small class="text-muted">Cette action est irréversible.</small>
      </div>
      <div class="modal-footer border-0 d-flex justify-content-center">
        <button type="button" class="btn btn-light px-4" (click)="fermerModal()">Annuler</button>
        <button type="button" class="btn btn-danger px-4" (click)="confirmerDelete()">Supprimer définitivement</button>
      </div>
    </div>
  </div>
</div>
