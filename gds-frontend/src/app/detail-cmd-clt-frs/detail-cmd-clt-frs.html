<div class="card mb-3 mt-2 custom-border shadow-sm">
    <div class="card-body p-3">
        <div class="row g-3">
            <div class="col-12 col-md-2 d-flex justify-content-center align-items-center border-md-end">
                <img src="/product.png" class="img-fluid rounded" style="max-width: 80px;" alt="Client">
            </div>

            <div class="col-12 col-sm-6 col-md-3 border-md-end">
                <div class="d-flex align-items-center mb-1">
                    <i class="fa-solid fa-user me-2 text-primary"></i>
                    <span class="fw-bold">{{cltFrs.nom}} {{cltFrs.prenom}}</span>
                </div>
                <div class="d-flex align-items-center text-muted small">
                    <i class="fa-solid fa-phone me-2"></i>
                    <span>{{cltFrs.numTel}}</span>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3 border-md-end">
                <div class="mb-1">
                    <i class="fa-solid fa-qrcode me-2 text-secondary"></i>
                    <span class="badge bg-light text-dark border">{{commande.code}}</span>
                </div>
                <div class="mb-1 small">
                    <i class="fa-regular fa-calendar me-2"></i>
                    <span>{{commande.dateCommande | date:'dd/MM/yyyy HH:mm'}}</span>
                </div>
                <div class="small">
                    <i class="fa-solid fa-circle-check me-2 text-success"></i>
                    <span class="text-uppercase">{{commande.etatCommande}}</span>
                </div>
            </div>

            <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-around align-items-center gap-2">
                <button type="button" class="btn btn-outline-primary btn-sm w-100" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <i class="fa-solid fa-pencil me-1"></i>Modifier
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm w-100" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <i class="fa-solid fa-trash-can me-1"></i>Supprimer
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Correction de stock</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control" id="recipient-name" placeholder="Quantité">
          </div>
          <div class="mb-3">
            <select class="form-control" id="message-text">
                <option>CORRECTION POSITIVE</option>
                <option>CORRECTION NEGATIVE</option>
            </select>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fas fa-ban"></i>Annuler</button>
        <button type="button" class="btn btn-primary"><i class="fas fa-save"></i>Enregistrer</button>
      </div>

    </div>
  </div>
</div>
