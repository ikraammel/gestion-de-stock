<div class="col">
    <div class="row m-3">
        <div class="col-md-4 p-0 ">
            <h1>Liste des fournisseurs</h1>
        </div>
        <div class="col-md-4 text-end me-1">
            <app-boutton-action (clickEvent)="nouveauFournisseur()"></app-boutton-action>
        </div>
    </div>

    <div class="card m-3 me-0">
        <div class="alert alert-danger" *ngIf="errorMsg">
            {{errorMsg}}
        </div>
        <app-detail-clt-frns
         *ngFor="let fournisseur of listFournisseurs" 
         [clientFournisseur]="fournisseur"
         [origin]="'fournisseur'"
         (suppressionResult)="handleSuppression($event)"
         ></app-detail-clt-frns>
    </div> 

    <div class="row mb-3 text-center">
        <app-pagination></app-pagination>
    </div>
</div>
