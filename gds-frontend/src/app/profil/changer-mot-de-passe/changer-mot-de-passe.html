<div class="container-fluid px-2 px-md-4 py-4">
  <div class="row g-4">
    
    <div class="col-12 col-lg-4 col-xl-3">
      <div class="card shadow-sm border-0 h-100 text-center">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <div class="mb-3 mt-2">
            <img src="product.png" 
                 class="rounded-circle border border-3 border-light shadow-sm" 
                 style="width: 140px; height: 140px; object-fit: cover;"
                 alt="Profil">
          </div>
          <h2 class="h5 fw-bold mb-1">Nom Prenom</h2>
          <p class="text-muted small mb-0">
            <i class="fa-solid fa-location-dot me-1"></i>Adresse, ville, 12345
          </p>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8 col-xl-9">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white py-3 border-bottom-0">
          <h5 class="mb-0 fw-bold text-primary">
            <i class="fa-solid fa-key me-2"></i>Sécurité du compte
          </h5>
        </div>
        
        <div class="card-body p-4 p-md-5">
          <form>
            <div class="mb-4">
              <label class="form-label small fw-bold">Ancien mot de passe</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="fa-solid fa-lock-open text-muted"></i></span>
                <input type="password" class="form-control bg-light border-0" 
                       placeholder="Saisissez votre mot de passe actuel" 
                       [(ngModel)]="ancienMotDePasse" name="ancienMotDePasse">
              </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label class="form-label small fw-bold">Nouveau mot de passe</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-0"><i class="fa-solid fa-key text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-0" 
                         placeholder="Nouveau mot de passe" 
                         [(ngModel)]="changerMotDePasseDto.motDePasse" name="nouveauMotDePasse">
                </div>
              </div>
              
              <div class="col-12 col-md-6">
                <label class="form-label small fw-bold">Confirmer le nouveau mot de passe</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-0"><i class="fa-solid fa-shield-check text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-0" 
                         placeholder="Confirmer" 
                         [(ngModel)]="changerMotDePasseDto.confirmMotDePasse" name="confirmMotDePasse">
                </div>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-5">
              <button type="button" class="btn btn-outline-danger px-4 py-2 order-2 order-sm-1" (click)="cancel()">
                <i class="fa-solid fa-ban me-2"></i> Annuler
              </button>
              <button type="button" class="btn btn-primary px-4 py-2 shadow-sm order-1 order-sm-2" (click)="changerMotDePasseUtilisateur()">
                <i class="fa-regular fa-floppy-disk me-2"></i> Enregistrer les modifications
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
