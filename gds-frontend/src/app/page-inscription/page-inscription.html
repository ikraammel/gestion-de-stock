<div class="auth-wrapper d-flex align-items-center justify-content-center py-5 bg-light min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        
        <div class="card border-0 shadow-lg">
          <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0 fw-bold">S'inscrire</h3>
            <p class="small mb-0">Rejoignez notre système de gestion</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <div class="alert alert-danger border-0 shadow-sm" *ngIf="errors.length > 0">
              <ul class="mb-0 small">
                <li *ngFor="let msg of errors">{{msg}}</li>
              </ul>
            </div>

            <form>
              <h6 class="text-primary fw-bold mb-3 border-bottom pb-2">Entreprise</h6>
              <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6">
                  <input type="text" class="form-control" placeholder="Nom Entreprise" [(ngModel)]="entrepriseDto.nom" name="nom">
                </div>
                <div class="col-12 col-sm-6">
                  <input type="number" class="form-control" placeholder="Code fiscal" [(ngModel)]="entrepriseDto.codeFiscal" name="codeFiscal">
                </div>
                <div class="col-12">
                  <input type="email" class="form-control" placeholder="Email contact" [(ngModel)]="entrepriseDto.email" name="email">
                </div>
              </div>

              <h6 class="text-primary fw-bold mb-3 border-bottom pb-2">Localisation</h6>
              <div class="row g-3 mb-4">
                <div class="col-12">
                  <input type="text" class="form-control" placeholder="Adresse Principale" [(ngModel)]="adresse.adresse1" name="adresse1">
                </div>
                <div class="col-12 col-sm-6">
                  <input type="text" class="form-control" placeholder="Ville" [(ngModel)]="adresse.ville" name="ville">
                </div>
                <div class="col-12 col-sm-6">
                  <input type="number" class="form-control" placeholder="Code Postal" [(ngModel)]="adresse.codePostale" name="codePostale">
                </div>
                <div class="col-12">
                  <input type="text" class="form-control" placeholder="Pays" [(ngModel)]="adresse.pays" name="pays">
                </div>
              </div>

              <div class="mb-4">
                <textarea class="form-control" rows="3" placeholder="Description de l'activité" [(ngModel)]="entrepriseDto.description" name="description"></textarea>
              </div>

              <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary btn-lg shadow" (click)="register()">
                  <i class="fa-solid fa-user-plus me-2"></i>Créer mon compte
                </button>
                <div class="text-center mt-3">
                  <span class="small text-muted">Déjà inscrit ?</span>
                  <a [routerLink]="['/login']" class="btn btn-link btn-sm fw-bold">Se Connecter</a>
                </div>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
