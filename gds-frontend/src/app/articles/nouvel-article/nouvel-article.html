<div class="container-fluid py-3">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <button (click)="fileInput.click()" class="btn p-0 border-0 bg-transparent">
               <img [src]="imgUrl" class="rounded-circle border shadow-sm" width="150" height="150" style="object-fit: cover;"> 
               <input hidden type="file" #fileInput (change)="onFileInput(fileInput.files)">
            </button>
            <p class="text-muted small mt-2">Cliquez pour changer la photo</p>
        </div>
    </div>

    <hr>

    <div class="row">
        <div class="col-12 mb-3">
            <h4 class="h5"><i class="fa-solid fa-circle-info me-2 text-primary"></i>Information de l'article</h4>
        </div>
        
        <div class="col-12">
            <div class="alert alert-danger" *ngIf="errorMsg.length > 0">
                <ul class="mb-0">
                    <li *ngFor="let msg of errorMsg">{{msg}}</li>
                </ul>
            </div>

            <form>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold">Code article</label>
                        <input type="text" class="form-control" placeholder="Ex: ART001" name="codeArticle" [(ngModel)]="articleDto.codeArticle">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold">Désignation</label>
                        <input type="text" class="form-control" placeholder="Désignation de l'article" name="designationArticle" [(ngModel)]="articleDto.designation">
                    </div>
                </div> 

                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6 col-md-6">
                        <label class="form-label small fw-bold">Prix HT</label>
                        <input type="number" class="form-control" placeholder="0.00" name="prixUnitHT" [(ngModel)]="articleDto.prixUnitaireHt" (input)="calculerTTC()">
                    </div>
                    <div class="col-12 col-sm-6 col-md-6">
                        <label class="form-label small fw-bold">Taux TVA (%)</label>
                        <input type="number" class="form-control" placeholder="20" name="tauxtva" [(ngModel)]="articleDto.tauxTva" (input)="calculerTTC()">
                    </div>
                </div> 

                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-6 col-md-6">
                        <label class="form-label small fw-bold">Prix TTC</label>
                        <input type="number" class="form-control bg-light" placeholder="Calculé automatiquement" name="prixUnitTTC" [(ngModel)]="articleDto.prixUnitaireTtc" readonly>
                    </div>
                    <div class="col-12 col-sm-6 col-md-6">
                        <label class="form-label small fw-bold">Catégorie</label>
                        <select class="form-select" name="cat" [(ngModel)]="categoryDto">
                            <option [ngValue]="null" disabled selected>Choisir une catégorie...</option>
                            <option *ngFor="let cat of listCategories" [ngValue]="cat">{{cat.code}} - {{cat.designation}}</option>
                        </select>
                    </div>
                </div> 
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-12 d-flex justify-content-end gap-2 mt-2">
            <button type="button" class="btn btn-outline-danger px-4" (click)="cancelClick()">
                <i class="fa-solid fa-ban me-2"></i>Annuler
            </button>
            <button type="button" class="btn btn-primary px-4 shadow" (click)="enregistrerArticle()">
                <i class="fa-regular fa-floppy-disk me-2"></i>Enregistrer
            </button>
        </div>
    </div>
</div>
