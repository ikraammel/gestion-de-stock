<div class="col">
    <div class="col-md-12 mb-2 ms-3">
        <img src="product.png" class="rounded-circle" width="150px" height="150px">
    </div>
    <hr>
    <div class="col-md-12">
        <div class="col-md-12 mb-3">
            <h4><i class="fa-solid fa-circle-info me-2"></i>Information de l'utilisateur</h4>
        </div>
        <div class="col-md-12">
            <form>
                <div class="row mb-3 ms-2 me-2">
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Nom">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Adresse 1">
                    </div>
                </div> 
                <div class="row mb-3 ms-2 me-2">
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Prenom">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Adresse 2">
                    </div>
                </div> 
                 <div class="row ms-2 me-2 mb-2">
                    <div class="col">
                        <input type="email" class="form-control" placeholder="E-Mail">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Ville">
                    </div>
                </div> 
                <div class="row ms-2 me-2 mb-2">
                    <div class="col">
                        <input type="tel" class="form-control" placeholder="Telephone">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Code postal">
                    </div>
                </div> 
                <div class="row ms-2 me-2">
                    <div class="col">
                        &nbsp;
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Pays">
                    </div>
                </div> 
            </form>
        </div>
        </div>
    <div class="col-md-12 text-end mt-3 mb-3">
        <button type="button" class="btn btn-danger me-3" (click)="cancelClick()"><i class="fa-solid fa-ban"></i>Annuler</button>
        <button type="button" class="btn btn-primary me-3"><i class="fa-regular fa-floppy-disk"></i>Enregistrer</button>
    </div>
</div>
